stages:
  - lint
  - test

cache:
  paths:
    - node_modules/

lint:
  stage: lint
  image: node:16
  cache:
    - key: node-modules
      paths:
        - node_modules/
  script:
    - npm ci
    - npx eslint .
  only:
    - practice
    - main

test:
  stage: test
  image: node:16
  cache:
    - key: node-modules
      paths:
        - node_modules/
  script:
    - npm ci
    - npm test
  only:
    - practice
    - main